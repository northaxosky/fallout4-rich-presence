name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  xmake:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: use dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "latest"

      - name: config
        run: xmake config -y --mode=releasedbg --toolchain=msvc

      - name: build
        run: xmake build -y -vD

      - name: test
        run: |
          xmake build -y FormatTemplateTests
          xmake run FormatTemplateTests

      - name: get short sha
        run: echo "SHORT_SHA=$("${{ github.sha }}".SubString(0, 8))" >> $env:GITHUB_ENV

      - name: bundle
        run: |
          $root = "Fallout4RichPresence-${{ env.SHORT_SHA }}"
          $dest = Join-Path $root "F4SE\Plugins"
          New-Item -ItemType Directory -Path $dest -Force
          Get-ChildItem -Recurse -Path ".\build\windows\x64\releasedbg" -Include "Fallout4RichPresence.dll", "Fallout4RichPresence.pdb" |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination (Join-Path $dest $_.Name) -Force }
          Copy-Item -Path ".\data\F4SE\Plugins\Fallout4RichPresence.toml" -Destination $dest -Force
          Copy-Item -Path ".\data\presets" -Destination (Join-Path $root "presets") -Recurse -Force
          Copy-Item -Path ".\data\fomod" -Destination (Join-Path $root "fomod") -Recurse -Force

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Fallout4RichPresence-${{ env.SHORT_SHA }}
          path: "Fallout4RichPresence-${{ env.SHORT_SHA }}"
